name: Build and test

# No push trigger: every push to snd, dev or main runs release.yml, whose Test step is the
# gate; running the suite here as well doubled the one runner's work per push.
on:
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'repomix-output.xml'

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: [self-hosted, Windows, X64]
    # cmd, not powershell: the runner account's execution policy is Restricted, so a powershell
    # step cannot load the script GitHub writes for it. cmd needs no Git Bash path step.
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      # The runner account cannot write C:\Program Files\dotnet; install under the tool cache.
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}\dotnet
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      # No trx logger and no artifact upload: nothing read the trx, and a failed test's name
      # is already in the job log (CI review 2026-09-25).
      - run: dotnet test --no-build -c Release
